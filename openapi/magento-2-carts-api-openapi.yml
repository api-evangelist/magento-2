openapi: 3.1.0
info:
  title: Adobe Commerce (Magento 2) REST Auth Carts API
  description: Adobe Commerce (formerly Magento 2) exposes a REST API at the `/rest/{store-code}/V1/` (or simply `/rest/V1/`) base path for managing products, orders, customers, carts, categories, and other commerce resources. Authentication supports admin and customer integration tokens issued by the API, plus OAuth 1.0a for third-party integrations.
  version: 1.0.0
  contact:
    name: Adobe Commerce
    url: https://developer.adobe.com/commerce/webapi/rest/
servers:
- url: https://{host}/rest/{storeCode}
  description: Adobe Commerce instance (replace {host} with your storefront and {storeCode} with `V1` or e.g. `default`)
  variables:
    host:
      default: example.com
    storeCode:
      default: V1
security:
- BearerAuth: []
tags:
- name: Carts
paths:
  /V1/carts/mine:
    get:
      tags:
      - Carts
      summary: Get the current customer cart
      operationId: getMyCart
      responses:
        '200':
          description: Cart
    post:
      tags:
      - Carts
      summary: Create a customer cart
      operationId: createMyCart
      responses:
        '200':
          description: Cart ID
  /V1/carts/mine/items:
    post:
      tags:
      - Carts
      summary: Add an item to the current cart
      operationId: addItemToMyCart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Cart item
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Bearer token obtained from /V1/integration/admin/token or /V1/integration/customer/token.
