openapi: 3.1.0
info:
  title: Adobe Commerce (Magento 2) REST API
  description: >-
    Adobe Commerce (formerly Magento 2) exposes a REST API at the
    `/rest/{store-code}/V1/` (or simply `/rest/V1/`) base path for managing
    products, orders, customers, carts, categories, and other commerce
    resources. Authentication supports admin and customer integration tokens
    issued by the API, plus OAuth 1.0a for third-party integrations.
  version: "1.0.0"
  contact:
    name: Adobe Commerce
    url: https://developer.adobe.com/commerce/webapi/rest/
servers:
  - url: https://{host}/rest/{storeCode}
    description: Adobe Commerce instance (replace {host} with your storefront and {storeCode} with `V1` or e.g. `default`)
    variables:
      host:
        default: example.com
      storeCode:
        default: V1
security:
  - BearerAuth: []
tags:
  - name: Auth
  - name: Products
  - name: Orders
  - name: Customers
  - name: Carts
  - name: Categories
paths:
  /V1/integration/admin/token:
    post:
      tags: [Auth]
      summary: Request an admin integration token
      operationId: createAdminToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Bearer token string
          content:
            application/json:
              schema:
                type: string
  /V1/integration/customer/token:
    post:
      tags: [Auth]
      summary: Request a customer integration token
      operationId: createCustomerToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Bearer token string
          content:
            application/json:
              schema:
                type: string
  /V1/products:
    get:
      tags: [Products]
      summary: Search products
      operationId: searchProducts
      parameters:
        - name: searchCriteria
          in: query
          required: false
          schema:
            type: object
      responses:
        '200':
          description: Product search results
    post:
      tags: [Products]
      summary: Create a product
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Created product
  /V1/products/{sku}:
    get:
      tags: [Products]
      summary: Get product by SKU
      operationId: getProduct
      parameters:
        - name: sku
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product
    put:
      tags: [Products]
      summary: Update product by SKU
      operationId: updateProduct
      parameters:
        - name: sku
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Updated product
    delete:
      tags: [Products]
      summary: Delete product by SKU
      operationId: deleteProduct
      parameters:
        - name: sku
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
  /V1/orders:
    get:
      tags: [Orders]
      summary: Search orders
      operationId: searchOrders
      parameters:
        - name: searchCriteria
          in: query
          required: false
          schema:
            type: object
      responses:
        '200':
          description: Order search results
  /V1/orders/{id}:
    get:
      tags: [Orders]
      summary: Get order by ID
      operationId: getOrder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Order
  /V1/customers:
    post:
      tags: [Customers]
      summary: Create a customer
      operationId: createCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Customer
  /V1/customers/search:
    get:
      tags: [Customers]
      summary: Search customers
      operationId: searchCustomers
      responses:
        '200':
          description: Customer search results
  /V1/customers/{customerId}:
    get:
      tags: [Customers]
      summary: Get customer by ID
      operationId: getCustomer
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Customer
  /V1/carts/mine:
    get:
      tags: [Carts]
      summary: Get the current customer cart
      operationId: getMyCart
      responses:
        '200':
          description: Cart
    post:
      tags: [Carts]
      summary: Create a customer cart
      operationId: createMyCart
      responses:
        '200':
          description: Cart ID
  /V1/carts/mine/items:
    post:
      tags: [Carts]
      summary: Add an item to the current cart
      operationId: addItemToMyCart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Cart item
  /V1/categories:
    get:
      tags: [Categories]
      summary: Get the category tree
      operationId: getCategoryTree
      responses:
        '200':
          description: Category tree
  /V1/categories/{categoryId}:
    get:
      tags: [Categories]
      summary: Get category by ID
      operationId: getCategory
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Category
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Bearer token obtained from /V1/integration/admin/token or /V1/integration/customer/token.
