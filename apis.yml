apis:
- aid: magento-2:rest-api
  name: Adobe Commerce REST API
  description: >-
    REST API for managing products, customers, orders, inventory, cart, and checkout in Magento 2 / Adobe
    Commerce. The base URL pattern is https://{host}/rest/{storeCode}/V1/. Authentication supports OAuth
    1.0a for third-party integrations and bearer tokens for admin and customer sessions. A live Swagger
    UI is available at /swagger when running in developer mode and the OpenAPI schema is available via
    the schema endpoint.
  humanURL: https://developer.adobe.com/commerce/webapi/rest/
  baseURL: https://{host}/rest/{storeCode}/V1
  tags:
  - E-Commerce
  - REST
  - Catalog
  - Order
  - Customers
  tags_raw:
  - Ecommerce
  - REST
  - Catalog
  - Orders
  - Customers
