  - type: Documentation
    url: https://developer.adobe.com/commerce/webapi/rest/
  - type: REST Reference
    url: https://developer.adobe.com/commerce/webapi/reference/rest/paas/
  - type: OAuth Authentication
    url: >-
      https://developer.adobe.com/commerce/webapi/get-started/authentication/gs-authentication-oauth/
  - type: Token Authentication
    url: >-
      https://developer.adobe.com/commerce/webapi/get-started/authentication/gs-authentication-token/
  - type: OpenAPI Schema
    url: https://{host}/rest/default/schema?services=all
- aid: magento-2:graphql-api
  name: Adobe Commerce GraphQL API
  description: >-
    GraphQL API for headless storefront use cases in Magento 2 / Adobe Commerce, providing single-request
    access to catalog, cart, checkout, and customer data. Mutations require customer token authentication
    via the Authorization header.
  humanURL: https://developer.adobe.com/commerce/webapi/graphql/
  baseURL: https://{host}/graphql
